<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#02172f" media="(prefers-color-scheme: dark)">
  <title>ポモドーロタイマー | COACHING-L</title>
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ポモドーロ" data-i18n-content="homeScreenTitle">
  <!-- ?v= は更新のたびに1つ上げる（ブラウザに古いファイルが残って、表示が崩れるのを防ぐ） -->
  <link rel="stylesheet" href="style.css?v=7">
  <!-- defer を付けない：選んだ表示（ライト／ダーク）を最初の描画より前に反映して、ちらつきを防ぐため。
       画面の部品を使う処理は、app.js の中で DOMContentLoaded を待ってから行う -->
  <script src="app.js?v=7"></script>
</head>
<body>
  <div class="app">
    <main>
      <!-- 再読み込み後、画面に一度触れてもらうための案内。レイアウトをずらさないよう画面上部に重ねて出す -->
      <p class="notice touch-hint" id="touch-hint" role="status" data-i18n="touchHint" hidden></p>
      <noscript><p class="notice">このページを使うには JavaScript を有効にしてください。</p></noscript>

      <!-- 1. スタート -->
      <section class="view" data-view="start" hidden>
        <header class="brand-header">
          <img class="brand-logo" src="icons/logo-144.png" width="52" height="52" alt="">
          <div>
            <p class="brand-name" data-i18n="brand">COACHING-L</p>
            <h1 class="app-title" tabindex="-1" data-i18n="appTitle"></h1>
          </div>
        </header>

        <p class="notice" id="start-notice" role="status" hidden></p>
        <p class="notice notice-muted" id="storage-notice" data-i18n="storageUnavailable" hidden></p>

        <form id="start-form" class="stack" novalidate>
          <div class="field">
            <label for="intention" class="question" data-i18n="intentionLabel"></label>
            <input id="intention" class="text-input" type="text" maxlength="80" autocomplete="off" enterkeyhint="go" aria-describedby="intention-hint" data-i18n-placeholder="intentionPlaceholder">
            <p class="hint" id="intention-hint" data-i18n="intentionHint"></p>
          </div>

          <fieldset class="field">
            <legend class="field-label" data-i18n="workLabel"></legend>
            <div class="chips chips-4">
              <button type="button" class="chip" data-action="select-work" data-work="10" aria-pressed="false"></button>
              <button type="button" class="chip" data-action="select-work" data-work="15" aria-pressed="false"></button>
              <button type="button" class="chip" data-action="select-work" data-work="25" aria-pressed="false"></button>
              <button type="button" class="chip" data-action="select-work" data-work="custom" aria-pressed="false" data-i18n="customChip"></button>
            </div>
            <div class="custom-row" id="custom-row" hidden>
              <input id="work-custom" class="number-input" type="number" min="5" max="60" step="1" inputmode="numeric" aria-describedby="custom-hint" data-i18n-aria-label="customAria">
              <span class="unit" data-i18n="minuteUnit"></span>
              <p class="hint" id="custom-hint" data-i18n="customHint" aria-live="polite"></p>
            </div>
          </fieldset>

          <p class="break-summary" id="break-summary"></p>

          <button type="submit" class="btn btn-primary btn-large btn-block" data-i18n="startButton"></button>
        </form>

        <div class="start-footer">
          <button type="button" class="btn btn-secondary btn-block" data-action="open-log" data-i18n="openLog"></button>

          <details class="settings">
            <summary data-i18n="settingsTitle"></summary>
            <div class="settings-body stack">
              <div class="field">
                <label for="break-minutes" class="field-label" data-i18n="breakLabel"></label>
                <div class="custom-row">
                  <input id="break-minutes" class="number-input" type="number" min="1" max="30" step="1" inputmode="numeric" aria-describedby="break-hint">
                  <span class="unit" data-i18n="minuteUnit"></span>
                  <p class="hint" id="break-hint" data-i18n="breakHint"></p>
                </div>
              </div>
              <fieldset class="field">
                <legend class="field-label" data-i18n="themeLabel"></legend>
                <div class="chips chips-3">
                  <button type="button" class="chip" data-action="select-theme" data-theme-choice="auto" aria-pressed="false" data-i18n="themeAuto"></button>
                  <button type="button" class="chip" data-action="select-theme" data-theme-choice="light" aria-pressed="false" data-i18n="themeLight"></button>
                  <button type="button" class="chip" data-action="select-theme" data-theme-choice="dark" aria-pressed="false" data-i18n="themeDark"></button>
                </div>
                <p class="hint" data-i18n="themeHint"></p>
              </fieldset>
              <div class="field">
                <span class="field-label" data-i18n="screenLabel"></span>
                <label class="toggle" id="keep-screen-row">
                  <input type="checkbox" id="keep-screen" aria-describedby="keep-screen-hint">
                  <span data-i18n="keepScreenLabel"></span>
                </label>
                <p class="hint" id="keep-screen-hint"></p>
              </div>
              <div class="field">
                <span class="field-label" data-i18n="notifyLabel"></span>
                <button type="button" class="btn btn-secondary" id="notify-btn" data-action="request-notify" data-i18n="notifyButton"></button>
                <p class="hint" id="notify-status" aria-live="polite"></p>
                <button type="button" class="btn btn-secondary" id="notify-test-btn" data-action="test-notify" data-i18n="notifyTest" hidden></button>
                <p class="hint" id="notify-test-status" aria-live="polite"></p>
                <p class="hint" id="notify-os-hint" data-i18n="notifyOsHint" hidden></p>
                <p class="hint" id="notify-note" data-i18n="notifyNote"></p>
              </div>
            </div>
          </details>
        </div>
      </section>

      <!-- 2. 集中中 -->
      <section class="view view-center" data-view="focus" hidden>
        <h2 class="visually-hidden" tabindex="-1" data-i18n="focusHeading"></h2>
        <p class="time" id="focus-time" role="timer">00:00</p>
        <p class="intention" id="focus-intention"></p>
        <p class="paused-note" id="paused-note" data-i18n="pausedNote" hidden></p>
        <div class="actions">
          <button type="button" class="btn btn-secondary btn-block" id="pause-btn" data-action="toggle-pause"></button>
          <button type="button" class="btn btn-ghost btn-block" data-action="stop" data-i18n="stop"></button>
        </div>
      </section>

      <!-- 2'. やめたあと -->
      <section class="view view-center" data-view="stopped" hidden>
        <p class="message" tabindex="-1" data-i18n="stoppedMessage"></p>
        <p class="sub" id="stopped-detail"></p>
        <div class="actions">
          <button type="button" class="btn btn-primary btn-block" data-action="go-start" data-i18n="backToStart"></button>
        </div>
      </section>

      <!-- 3. 振り返り -->
      <section class="view" data-view="review" hidden>
        <h2 class="lead" tabindex="-1" data-i18n="reviewTitle"></h2>
        <p class="recap" id="review-intention"></p>
        <p class="notice notice-muted" id="review-notice" hidden></p>

        <fieldset class="field">
          <legend class="field-label" data-i18n="focusQuestion"></legend>
          <div class="chips chips-5 scale">
            <button type="button" class="chip chip-tall" data-action="select-focus" data-focus="1" aria-pressed="false">1</button>
            <button type="button" class="chip chip-tall" data-action="select-focus" data-focus="2" aria-pressed="false">2</button>
            <button type="button" class="chip chip-tall" data-action="select-focus" data-focus="3" aria-pressed="false">3</button>
            <button type="button" class="chip chip-tall" data-action="select-focus" data-focus="4" aria-pressed="false">4</button>
            <button type="button" class="chip chip-tall" data-action="select-focus" data-focus="5" aria-pressed="false">5</button>
          </div>
          <div class="scale-labels" aria-hidden="true">
            <span data-i18n="focusLow"></span>
            <span data-i18n="focusHigh"></span>
          </div>
        </fieldset>

        <fieldset class="field">
          <legend class="field-label" data-i18n="feelingQuestion"></legend>
          <div class="chips chips-3" id="feeling-chips"></div>
        </fieldset>

        <p class="hint hint-center" data-i18n="reviewSkipHint"></p>
        <button type="button" class="btn btn-primary btn-large btn-block" data-action="to-break" data-i18n="toBreak"></button>
      </section>

      <!-- 4. 休憩 -->
      <section class="view view-center" data-view="break" hidden>
        <h2 class="phase-label" tabindex="-1" data-i18n="breakTitle"></h2>
        <p class="time time-break" id="break-time" role="timer">00:00</p>
        <p class="prompt" id="break-prompt"></p>
        <div class="actions">
          <button type="button" class="btn btn-secondary btn-block" data-action="end-break" data-i18n="endBreak"></button>
        </div>
      </section>

      <!-- 5. 記録（日ごと・週ごと） -->
      <section class="view" data-view="log" hidden>
        <h2 class="lead" tabindex="-1" data-i18n="logTitle"></h2>

        <div class="tabs" role="tablist" data-i18n-aria-label="logTabsLabel">
          <button type="button" class="tab" role="tab" id="tab-day" aria-controls="panel-day" aria-selected="true" data-action="log-tab" data-tab="day" data-i18n="tabDay"></button>
          <button type="button" class="tab" role="tab" id="tab-week" aria-controls="panel-week" aria-selected="false" data-action="log-tab" data-tab="week" data-i18n="tabWeek"></button>
        </div>

        <!-- 日ごと -->
        <div class="panel" role="tabpanel" id="panel-day" aria-labelledby="tab-day">
          <div class="period-nav">
            <button type="button" class="nav-btn" id="day-prev" data-action="day-prev" data-i18n="prevDay"></button>
            <h3 class="period-title" id="day-title" aria-live="polite"></h3>
            <button type="button" class="nav-btn" id="day-next" data-action="day-next" data-i18n="nextDay"></button>
          </div>
          <button type="button" class="link-btn" id="day-today" data-action="day-today" data-i18n="toToday" hidden></button>
          <p class="period-summary" id="day-summary"></p>
          <p class="resumed" id="day-resumed" hidden></p>
          <ol class="log-list" id="log-list"></ol>

          <details class="settings note-box" id="note-box">
            <summary data-i18n="noteTitle"></summary>
            <div class="note-body">
              <label class="field-label" for="note-good" data-i18n="noteGood"></label>
              <textarea class="text-input note-input" id="note-good" data-note="good" rows="2" maxlength="200"></textarea>
              <label class="field-label" for="note-next" data-i18n="noteNext"></label>
              <textarea class="text-input note-input" id="note-next" data-note="next" rows="2" maxlength="200"></textarea>
              <label class="field-label" for="note-moved" data-i18n="noteMoved"></label>
              <textarea class="text-input note-input" id="note-moved" data-note="moved" rows="2" maxlength="200"></textarea>
              <p class="hint" id="note-status" role="status"></p>
            </div>
          </details>

          <button type="button" class="btn btn-secondary btn-block" data-action="copy-day" data-i18n="copyDay"></button>
          <p class="hint hint-center" id="copy-status" role="status"></p>
          <div class="copy-fallback" id="copy-fallback" hidden>
            <p class="hint" data-i18n="copyFallbackHint"></p>
            <textarea class="text-input" id="copy-text" rows="8" readonly></textarea>
          </div>
        </div>

        <!-- 週ごと -->
        <div class="panel" role="tabpanel" id="panel-week" aria-labelledby="tab-week" hidden>
          <div class="period-nav">
            <button type="button" class="nav-btn" id="week-prev" data-action="week-prev" data-i18n="prevWeek"></button>
            <h3 class="period-title" id="week-title" aria-live="polite"></h3>
            <button type="button" class="nav-btn" id="week-next" data-action="week-next" data-i18n="nextWeek"></button>
          </div>
          <button type="button" class="link-btn" id="week-today" data-action="week-today" data-i18n="toThisWeek" hidden></button>

          <div class="week-summary" id="week-summary"></div>

          <figure class="chart-box">
            <figcaption class="chart-title" data-i18n="chartDailyTitle"></figcaption>
            <div class="chart" id="chart-daily"></div>
            <p class="chart-legend" id="legend-daily"></p>
          </figure>
          <ol class="day-rows" id="day-rows"></ol>

          <figure class="chart-box">
            <figcaption class="chart-title" data-i18n="chartBandsTitle"></figcaption>
            <p class="chart-note" id="bands-note"></p>
            <div class="chart" id="chart-bands"></div>
            <p class="chart-legend" id="legend-bands"></p>
            <details class="chart-table" id="bands-table-box">
              <summary data-i18n="showNumbers"></summary>
              <div class="table-wrap"><table id="bands-table"></table></div>
            </details>
          </figure>

          <section class="week-section" id="flow-section" hidden>
            <h3 class="section-title" data-i18n="flowTitle"></h3>
            <ol class="plain-list" id="flow-list"></ol>
          </section>

          <section class="week-section" id="week-notes-section" hidden>
            <h3 class="section-title" data-i18n="weekNotesTitle"></h3>
            <div id="week-notes"></div>
          </section>

          <section class="week-section questions">
            <h3 class="section-title" data-i18n="questionsTitle"></h3>
            <p data-i18n="questionUse"></p>
            <p data-i18n="questionPlace"></p>
            <p class="hint" data-i18n="questionsHint"></p>
          </section>
        </div>

        <!-- 記録のダウンロード（どちらのタブにも出す） -->
        <section class="download-box">
          <h3 class="section-title" data-i18n="downloadTitle"></h3>
          <div class="actions">
            <button type="button" class="btn btn-secondary btn-block" data-action="download-csv" data-i18n="downloadCsv"></button>
            <button type="button" class="btn btn-secondary btn-block" data-action="download-json" data-i18n="downloadJson"></button>
          </div>
          <p class="hint" data-i18n="downloadNote"></p>
          <p class="hint" data-i18n="downloadTrouble"></p>
          <p class="hint" id="download-status" role="status"></p>
        </section>

        <p class="hint hint-center" id="log-status" role="status"></p>
        <div class="actions">
          <button type="button" class="btn btn-primary btn-block" data-action="go-start" data-i18n="back"></button>
          <button type="button" class="btn btn-ghost btn-block btn-small" id="clear-btn" data-action="clear-all" data-i18n="clearAll"></button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p class="footer-brand" data-i18n="brand">COACHING-L</p>
      <p class="footer-privacy" data-i18n="privacyNote">記録はこの端末の中だけに保存され、外部には送信されません</p>
    </footer>
  </div>
</body>
</html>
